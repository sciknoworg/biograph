_type": "organization", "name": "University of Southern California", "subtype": "university", "summary": "Prof. DenBaars's group demonstrated ALD of GaAs in an atmospheric MOCVD system."}, {"id": "tut", "entity_type": "organization", "name": "Tampere University of Technology (TUT)", "subtype": "university", "summary": "Suntola was invited to give semiconductor physics lectures here in 1973 and was nominated as a docent; a small ALE-related III-V semiconductor research group formed here from 1975."}, {"id": "semi", "entity_type": "organization", "name": "SEMI (Semiconductor Equipment and Materials International)", "subtype": "organization", "summary": "US-based industry association; presented Suntola with the European SEMI Award 2004."}, {"id": "finlux", "entity_type": "organization", "name": "Finlux Inc.", "subtype": "company", "summary": "US company responsible for marketing the ALE-EL panels in the USA; Ulf Ström was its managing director."}, {"id": "elcoteq", "entity_type": "organization", "name": "Elcoteq Oy", "subtype": "company", "summary": "Spun off as an independent contract manufacturer from Lohja's microelectronics division in 1990/91; bought by Antti Piippo and colleagues in 1991; went bankrupt in 2011."}, {"id": "uni_helsinki_inorganic_chem", "entity_type": "organization", "name": "Laboratory of Inorganic Chemistry, University of Helsinki", "subtype": "lab", "summary": "Home of the Finnish Centre of Excellence in Atomic Layer Deposition, headed by Markku Leskelä and Mikko Ritala."}, {"id": "ale_invention", "entity_type": "artifact", "name": "Atomic Layer Epitaxy (ALE)", "subtype": "invention", "summary": "Suntola's technique of supplying elements to a surface in an alternated, cyclic, self-saturating manner. Conceived in early June 1974; later renamed Atomic Layer Deposition (ALD)."}, {"id": "humicap_sensor", "entity_type": "artifact", "name": "Humicap humidity sensor", "subtype": "product", "summary": "Thin polymer film capacitive humidity sensor developed by Suntola and Jorma Antson, completed by the end of 1973; still (as of 2014) the basis of the world-leading Vaisala instruments."}, {"id": "ale_patent_1974", "entity_type": "artifact", "name": "1974 ALE patent", "subtype": "patent", "summary": "First international ALE patent; Finnish priority date 29 November 1974, granted in more than twenty countries including the USA, Japan, and the Soviet Union."}, {"id": "ale_patent_1979", "entity_type": "artifact", "name": "1979 ALE patent (2nd)", "subtype": "patent", "summary": "Second important ALE patent, Finnish priority 28 February 1979, protecting the inert gas reactor and basic processes for ALE-produced EL displays; mentioned compound reactants (H2S)."}, {"id": "lcd_patent", "entity_type": "artifact", "name": "Liquid Crystal Display (LCD) color patent", "subtype": "patent", "summary": "Suntola's patent, 'Method for generating electronically controllable color elements and color display based on the method', applied for in 1985 and granted in 1990."}, {"id": "f120_reactor", "entity_type": "artifact", "name": "F-120 reactor", "subtype": "product", "summary": "Quick, compact research reactor for photovoltaic (CdTe) development designed by Suntola and Sven Lindfors at Microchemistry; also became the first commercial ALD reactor."}, {"id": "f450_reactor", "entity_type": "artifact", "name": "F-450 reactor", "subtype": "product", "summary": "Reactor enabling ALD processing of silicon wafers and glass substrates up to 450 mm x 450 mm at Microchemistry."}, {"id": "f1000_reactor", "entity_type": "artifact", "name": "F-1000 reactor", "subtype": "product", "summary": "Microchemistry Ltd. ALD reactor for coating big batches of 500 mm x 500 mm substrates."}, {"id": "ale_el_display", "entity_type": "artifact", "name": "ALE-EL thin film display", "subtype": "product", "summary": "Thin film electroluminescent flat panel display made using ALE-grown ZnS(Mn) and dielectric layers; first publicly disclosed at SID 1980."}, {"id": "semi_award_2004", "entity_type": "artifact", "name": "European SEMI Award 2004", "subtype": "award", "summary": "'Honoring the Pioneer in Atomic Layer Deposition Techniques ... that paved the way for the development of nanoscale semiconductor devices.'"}, {"id": "dynamic_universe_book", "entity_type": "artifact", "name": "The Dynamic Universe – toward a unified picture of physical reality", "subtype": "publication", "summary": "Suntola's book on a holistic, unified picture of physical reality, 3rd edition published April 2011 by Physics Foundations Society."}, {"id": "short_history_science_book", "entity_type": "artifact", "name": "The Short History of Science – or the long path to the union of metaphysics and empiricism", "subtype": "publication", "summary": "Suntola's book, published September 2012 by Physics Foundations Society."}], "events": [{"id": "suntola_born", "event_type": "birth", "label": "Tuomo Suntola born in Tampere", "description": "Tuomo Suntola was born in Tampere, Finland.", "date": {"display": "1943", "precision": "year", "sort_start": "1943-01-01", "sort_end": "1943-12-31"}, "location": "tampere", "participants": [{"entity_id": "tuomo_suntola", "role": "subject"}], "sources": [{"source_id": "puurunen2014", "page": 333}]}, {"id": "suntola_matriculation", "event_type": "education", "label": "Suntola completes matriculation examinations", "description": "Suntola went to school in Turku and completed his matriculation examinations (nation-wide examinations qualifying for university studies).", "date": {"display": "1962", "precision": "year", "sort_start": "1962-01-01", "sort_end": "1962-12-31"}, "location": "turku", "participants": [{"entity_id": "tuomo_suntola", "role": "subject"}], "sources": [{"source_id": "puurunen2014", "page": 333}]}, {"id": "suntola_starts_ee_studies", "event_type": "education", "label": "Suntola starts electrical engineering studies at HUT", "description": "Suntola started his studies on electrical engineering at Helsinki University of Technology (HUT-Teknillinen korkeakoulu, TKK).", "date": {"display": "1963", "precision": "year", "sort_start": "1963-01-01", "sort_end": "1963-12-31"}, "participants": [{"entity_id": "tuomo_suntola", "role": "subject"}, {"entity_id": "hut", "role": "institution"}], "sources": [{"source_id": "puurunen2014", "page": 333}]}, {"id": "vtt_semiconductor_lab_established", "event_type": "company_founded", "label": "VTT Semiconductor Laboratory established", "description": "VTT Semiconductor Laboratory was established as an integral part of Professor Thor Stubb's Electron Physics laboratory in HUT.", "date": {"display": "1964", "precision": "year", "sort_start": "1964-01-01", "sort_end": "1964-12-31"}, "participants": [{"entity_id": "vtt_semiconductor_lab", "role": "organization_founded"}, {"entity_id": "thor_stubb", "role": "founder"}], "sources": [{"source_id": "puurunen2014", "page": 333}]}, {"id": "suntola_masters_thesis", "event_type": "education", "label": "Suntola completes Master's thesis on Schottky diodes", "description": "Suntola completed his Master's thesis ('diplomityö') on Schottky diodes for radar detectors (metal-semiconductor diodes for microwave frequencies).", "date": {"display": "1967", "precision": "year", "sort_start": "1967-01-01", "sort_end": "1967-12-31"}, "participants": [{"entity_id": "tuomo_suntola", "role": "subject"}, {"entity_id": "hut", "role": "institution"}], "sources": [{"source_id": "puurunen2014", "page": 333}]}, {"id": "suntola_picosecond_switches", "event_type": "other", "label": "Suntola investigates picosecond switches for Prof. Stubb", "description": "Being an assistant teacher at HUT, Suntola proposed to Prof. Thor Stubb to investigate picosecond switches (amorphous chalcogenide compound thin films), a hot research topic of the time.", "date": {"display": "late 1960s", "precision": "decade", "sort_start": "1968-01-01", "sort_end": "1969-12-31"}, "participants": [{"entity_id": "tuomo_suntola", "role": "subject"}, {"entity_id": "thor_stubb", "role": "supervisor"}], "sources": [{"source_id": "puurunen2014", "page": 333}]}, {"id": "suntola_licentiate_thesis", "event_type": "education", "label": "Suntola finishes licentiate's thesis", "description": "Suntola finished a licentiate's thesis, 'On the mechanism of switching effect in chalcogenide thin films', on the picosecond-switch work.", "date": {"display": "1971", "precision": "year", "sort_start": "1971-01-01", "sort_end": "1971-12-31"}, "participants": [{"entity_id": "tuomo_suntola", "role": "subject"}, {"entity_id": "hut", "role": "institution"}], "sources": [{"source_id": "puurunen2014", "page": 334}]}, {"id": "vtt_first_industrial_order", "event_type": "other", "label": "VTT Semiconductor Laboratory receives its first industrial order", "description": "In the autumn of 1971, the Semiconductor Laboratory received its first industrial order: a task to develop a miniature solid-state humidity sensor for Vaisala Oy. Prof. Stubb assigned the challenge to Suntola a few months later, once he had finished his thesis.", "date": {"display": "autumn 1971", "precision": "circa", "sort_start": "1971-09-01", "sort_end": "1971-11-30"}, "participants": [{"entity_id": "tuomo_suntola", "role": "subject"}, {"entity_id": "thor_stubb", "role": "assigner"}, {"entity_id": "vaisala", "role": "client"}, {"entity_id": "vtt_semiconductor_lab", "role": "organization"}], "sources": [{"source_id": "puurunen2014", "page": 334}]}, {"id": "suntola_doctoral_thesis", "event_type": "education", "label": "Suntola becomes youngest Doctor of Science in Technology at HUT", "description": "Suntola finished a doctoral thesis on switching in chalcogenide thin films. In December 1971, at age 28, he became the youngest Doctor of Science in Technology from the Electrical Engineering department of HUT.", "date": {"display": "December 1971", "precision": "month", "sort_start": "1971-12-01", "sort_end": "1971-12-31"}, "participants": [{"entity_id": "tuomo_suntola", "role": "subject"}, {"entity_id": "hut", "role": "institution"}], "sources": [{"source_id": "puurunen2014", "page": 334}]}, {"id": "humicap_developed", "event_type": "invention", "label": "Humicap thin polymer film humidity sensor completed", "description": "Tapio Wiik made a pre-study of the state of the art in humidity sensing. Suntola started work on polymers instead of foils, dissolving the polymer material to create a thin film on a solid substrate. Jorma Antson completed the development by the end of 1973.", "date": {"display": "1973", "precision": "year", "sort_start": "1973-01-01", "sort_end": "1973-12-31"}, "participants": [{"entity_id": "tuomo_suntola", "role": "inventor"}, {"entity_id": "jorma_antson", "role": "inventor"}, {"entity_id": "tapio_wiik", "role": "contributor"}, {"entity_id": "humicap_sensor", "role": "invention"}, {"entity_id": "vaisala", "role": "client"}], "sources": [{"source_id": "puurunen2014", "page": 333, "quote": "Sentola started to work on polymers; ... Jorma Antson completed the development by the end of 1973."}]}, {"id": "suntola_joins_instrumentarium", "event_type": "employment_start", "label": "Suntola invited to establish a research group at Instrumentarium", "description": "Late in 1973, Suntola was contacted by the top management of Instrumentarium Oy. When the key technical team of its subsidiary Datex Oy left the company, Suntola was invited to establish a research group directly under Instrumentarium's management, with an open request to 'suggest and find out something'.", "date": {"display": "late 1973", "precision": "circa", "sort_start": "1973-10-01", "sort_end": "1973-12-31"}, "participants": [{"entity_id": "tuomo_suntola", "role": "subject"}, {"entity_id": "instrumentarium", "role": "employer"}, {"entity_id": "datex", "role": "former_employer"}], "sources": [{"source_id": "puurunen2014", "page": 333}]}, {"id": "team_moves_to_instrumentarium", "event_type": "relocation", "label": "Suntola's team moves from VTT to Instrumentarium", "description": "In the beginning of 1974, Suntola and the small humidity-sensor team moved from VTT to Instrumentarium (Ahertajantie 3, Tapiola, Espoo).", "date": {"display": "early 1974", "precision": "circa", "sort_start": "1974-01-01", "sort_end": "1974-02-28"}, "location": "espoo", "participants": [{"entity_id": "tuomo_suntola", "role": "subject"}, {"entity_id": "instrumentarium", "role": "employer"}, {"entity_id": "vtt_semiconductor_lab", "role": "former_employer"}], "sources": [{"source_id": "puurunen2014", "page": 334}]}, {"id": "ale_invented", "event_type": "invention", "label": "Suntola conceives Atomic Layer Epitaxy", "description": "'We had still an empty laboratory with just tables and chairs and a Periodic Table of the Elements hanging on the wall. Looking at the Periodic Table, and thinking of the overall symmetry in nature, to me came the idea of serving the complementary elements of a compound sequentially, one at a time, onto a surface.' The actual invention of ALE matured in early June 1974.", "date": {"display": "early June 1974", "precision": "month", "sort_start": "1974-06-01", "sort_end": "1974-06-15"}, "location": "espoo", "participants": [{"entity_id": "tuomo_suntola", "role": "inventor"}, {"entity_id": "ale_invention", "role": "invention"}], "sources": [{"source_id": "puurunen2014", "page": 334, "quote": "The actual invention of ALE matured in early June 1974."}]}, {"id": "first_ale_growth_experiments", "event_type": "other", "label": "First ALE growth experiments performed", "description": "The first growth experiments with the hybrid ALE-PVD reactor were made in August-September 1974. The very first experiment was successful: a film was observed to grow, though at a third of the expected monolayer-per-cycle rate.", "date": {"display": "August-September 1974", "precision": "range", "sort_start": "1974-08-01", "sort_end": "1974-09-30"}, "participants": [{"entity_id": "tuomo_suntola", "role": "subject"}, {"entity_id": "ale_invention", "role": "invention"}], "sources": [{"source_id": "puurunen2014", "page": 335}]}, {"id": "ale_patent_1974_filed", "event_type": "patent_filed", "label": "First ALE patent filed (priority Nov 29, 1974)", "description": "The ALE invention was protected by an international patent. The priority date comes from the Finnish application, filed on November 29, 1974. The patent was applied for, and granted, in more than twenty countries, including the United States, Japan, and the Soviet Union.", "date": {"display": "November 29, 1974", "precision": "day", "sort_start": "1974-11-29", "sort_end": "1974-11-29"}, "participants": [{"entity_id": "tuomo_suntola", "role": "inventor"}, {"entity_id": "ale_patent_1974", "role": "patent"}], "sources": [{"source_id": "puurunen2014", "page": 335}]}, {"id": "moscow_patent_hearing", "event_type": "meeting", "label": "ALE patent hearing in Moscow", "description": "Hearings related to the patent were organized in several countries, including the United States, Japan, and the Soviet Union. The patent hearing in Moscow, which Suntola describes as memorable, took about two hours; Suntola went there alone, assisted by two local attorneys. The patent was granted as applied.", "date": {"display": "1977 or 1978", "precision": "circa", "sort_start": "1977-01-01", "sort_end": "1978-12-31"}, "participants": [{"entity_id": "tuomo_suntola", "role": "subject"}, {"entity_id": "ale_patent_1974", "role": "patent"}], "sources": [{"source_id": "puurunen2014", "page": 335}]}, {"id": "ale_el_sold_to_lohja", "event_type": "company_sold", "label": "ALE-EL project sold to Lohja Oy", "description": "It was realized that the basic work needed had limited motivation in a small research team within a medical instrumentation trading company. In 1978, the ALE-EL project, with the personnel and the facility, was sold to Lohja Oy.", "date": {"display": "1978", "precision": "year", "sort_start": "1978-01-01", "sort_end": "1978-12-31"}, "participants": [{"entity_id": "instrumentarium", "role": "seller"}, {"entity_id": "lohja_oy", "role": "buyer"}, {"entity_id": "tuomo_suntola", "role": "transferred_personnel"}], "sources": [{"source_id": "puurunen2014", "page": 335}]}, {"id": "zncl2_h2s_process_demonstrated", "event_type": "other", "label": "ZnCl2 + H2S chloride ALE process demonstrated", "description": "An abrupt change occurred when a H2S gas bottle was acquired and coupled to the reactor, enabling the real ZnCl2 + H2S process. In the memorable first run the reactor tube walls were evenly covered with a strictly uniform film. Sven Lindfors is pictured next to the reactor; Arto Pakkala's reaction was 'That's it!'", "date": {"display": "1978", "precision": "year", "sort_start": "1978-01-01", "sort_end": "1978-12-31"}, "participants": [{"entity_id": "sven_lindfors", "role": "researcher"}, {"entity_id": "arto_pakkala", "role": "researcher"}, {"entity_id": "lohja_oy", "role": "organization"}], "sources": [{"source_id": "puurunen2014", "page": 336}]}, {"id": "ale_patent_1979_filed", "event_type": "patent_filed", "label": "Second ALE patent filed (priority Feb 28, 1979)", "description": "The inert gas reactor and the basic processes for the ALE-produced EL displays were protected by the second international ALE patent, with the priority date Feb 28, 1979 of the Finnish application. This patent also documented the ALE dielectric layers, and mentioned the option of using compound reactants (H2S).", "date": {"display": "February 28, 1979", "precision": "day", "sort_start": "1979-02-28", "sort_end": "1979-02-28"}, "participants": [{"entity_id": "tuomo_suntola", "role": "inventor"}, {"entity_id": "ale_patent_1979", "role": "patent"}], "sources": [{"source_id": "puurunen2014", "page": 335}]}, {"id": "sid_1980_disclosure", "event_type": "public_demonstration", "label": "First public disclosure of ALE-EL thin film display at SID", "description": "The first disclosure of the ALE-EL work happened at the Society for Information Display (SID) conference in San Diego, California, April 29 to May 1, 1980, in front of about 1000 people. Suntola, from an unknown company in an unknown country, gave the presentation; the demo had such high contrast that the EL light was well visible even in bright projector light.", "date": {"display": "April 29 - May 1, 1980", "precision": "range", "sort_start": "1980-04-29", "sort_end": "1980-05-01"}, "location": "san_diego", "participants": [{"entity_id": "tuomo_suntola", "role": "presenter"}, {"entity_id": "ale_el_display", "role": "invention"}], "sources": [{"source_id": "puurunen2014", "page": 337}]}, {"id": "san_diego_1981_conference", "event_type": "conference", "label": "Suntola presents ALE at Vapor Growth and Epitaxy 5", "description": "Suntola gave a presentation on ALE at the International Conference on Vapor Growth and Epitaxy 5 in San Diego, California, in 1981. The presentation was not a big success; there was very little scientific information available, and use of the term 'epitaxy' for non-single-crystal films offended some in the audience. Jun-ichi Nishizawa from Japan was among the participants and realized the significance of ALE.", "date": {"display": "1981", "precision": "year", "sort_start": "1981-01-01", "sort_end": "1981-12-31"}, "location": "san_diego", "participants": [{"entity_id": "tuomo_suntola", "role": "presenter"}, {"entity_id": "jun_ichi_nishizawa", "role": "attendee"}], "sources": [{"source_id": "puurunen2014", "page": 341}]}, {"id": "lohja_tfel_pilot_production", "event_type": "product_launch", "label": "Pilot production of TF-EL displays starts at Lohja", "description": "In 1983, the pilot production of TF-EL displays started in Lohja, at the Kunnarla plant. The first real proof-of-concept of the ALE-EL displays was the large information boards installed at Helsinki-Vantaa airport's departure hall in 1983.", "date": {"display": "1983", "precision": "year", "sort_start": "1983-01-01", "sort_end": "1983-12-31"}, "location": "lohja_city", "participants": [{"entity_id": "lohja_oy", "role": "producer"}, {"entity_id": "ale_el_display", "role": "product"}], "sources": [{"source_id": "puurunen2014", "page": 337}]}, {"id": "cge_license_1983", "event_type": "other", "label": "ALE-EL technology licensed to France (CGE)", "description": "In the early 1980s the ALE-EL technology was licensed to France. First contacts were made at the 1980 SID conference; the big French state-owned company CGE became interested, and an ALE-EL license was granted in 1983 (to local arrangements between French state-owned companies, now Sintra Alcatel).", "date": {"display": "1983", "precision": "year", "sort_start": "1983-01-01", "sort_end": "1983-12-31"}, "participants": [{"entity_id": "lohja_oy", "role": "licensor"}, {"entity_id": "cge", "role": "licensee"}, {"entity_id": "ale_el_display", "role": "product"}], "sources": [{"source_id": "puurunen2014", "page": 343}]}, {"id": "nishizawa_kobe_1984", "event_type": "conference", "label": "Nishizawa introduces MLE-grown GaAs in Kobe; Suntola gives general ALE talk", "description": "Nishizawa introduced his MLE-grown GaAs at the 16th International Conference on Solid State Devices and Materials, in Kobe, Japan, 1984. Suntola was invited to give a general talk on ALE at the conference; it was successful, given to an overfull room, and Suntola was interviewed about ALE on Japanese TV.", "date": {"display": "1984", "precision": "year", "sort_start": "1984-01-01", "sort_end": "1984-12-31"}, "location": "kobe", "participants": [{"entity_id": "jun_ichi_nishizawa", "role": "presenter"}, {"entity_id": "tuomo_suntola", "role": "presenter"}], "sources": [{"source_id": "puurunen2014", "page": 341}]}, {"id": "ale1_symposium_1984", "event_type": "conference", "label": "First Symposium on Atomic Layer Epitaxy held in Espoo", "description": "The first specific ALE conference, the 'First Symposium on Atomic Layer Epitaxy', was organized in Espoo, Finland, on December 13-14, 1984, by VTT Semiconductor Laboratory upon the initiation of Professor Lauri Niinistö.", "date": {"display": "December 13-14, 1984", "precision": "range", "sort_start": "1984-12-13", "sort_end": "1984-12-14"}, "location": "espoo", "participants": [{"entity_id": "lauri_niinisto", "role": "organizer"}, {"entity_id": "vtt_semiconductor_lab", "role": "organizer"}], "sources": [{"source_id": "puurunen2014", "page": 342}]}, {"id": "lcd_patent_filed", "event_type": "patent_filed", "label": "Suntola's LCD color patent applied for", "description": "Suntola also had a patent on Liquid Crystal Displays (LCDs): 'Method for generating electronically controllable color elements and color display based on the method', applied for in 1985.", "date": {"display": "1985", "precision": "year", "sort_start": "1985-01-01", "sort_end": "1985-12-31"}, "participants": [{"entity_id": "tuomo_suntola", "role": "inventor"}, {"entity_id": "lcd_patent", "role": "patent"}], "sources": [{"source_id": "puurunen2014", "page": 343}]}, {"id": "olarinluoma_production_starts", "event_type": "product_launch", "label": "Data module production starts at Olarinluoma facility", "description": "Year 1983 was financially favorable for Lohja; a large EL production facility with high-level cleanrooms was built in Espoo, Olarinluoma, finished on time. Production of the data display module started gradually in the Olarinluoma facility in 1985, and distribution channels opened in the USA and other major industrialized countries.", "date": {"display": "1985", "precision": "year", "sort_start": "1985-01-01", "sort_end": "1985-12-31"}, "location": "espoo", "participants": [{"entity_id": "lohja_oy", "role": "producer"}, {"entity_id": "ale_el_display", "role": "product"}], "sources": [{"source_id": "puurunen2014", "page": 337}]}, {"id": "microchemistry_founded", "event_type": "company_founded", "label": "Microchemistry Ltd. founded; Suntola steps aside from EL", "description": "In the mid-1980s, Neste's venture unit NAPS, headed by Tapio Alvesalo, saw the potential of applying ALE to manufacturing thin film solar panels. In 1987, Tuomo Suntola was offered the chance to set up Microchemistry Ltd, a subsidiary of Neste, for the development of ALE-based solar panels; he also saw the possibility of applying ALE to heterogeneous catalysis.", "date": {"display": "1987", "precision": "year", "sort_start": "1987-01-01", "sort_end": "1987-12-31"}, "participants": [{"entity_id": "tuomo_suntola", "role": "founder"}, {"entity_id": "microchemistry", "role": "organization_founded"}, {"entity_id": "neste", "role": "parent_company"}, {"entity_id": "tapio_alvesalo", "role": "instigator"}], "sources": [{"source_id": "puurunen2014", "page": 338}]}, {"id": "f120_reactor_built", "event_type": "other", "label": "F-120 photovoltaic research reactor built", "description": "As the first task in Microchemistry, Tuomo Suntola and Sven Lindfors designed a quick, compact research reactor for photovoltaic (CdTe) development: the F-120, which also became the first commercial ALD reactor.", "date": {"display": "late 1980s", "precision": "decade", "sort_start": "1987-01-01", "sort_end": "1989-12-31"}, "participants": [{"entity_id": "tuomo_suntola", "role": "designer"}, {"entity_id": "sven_lindfors", "role": "designer"}, {"entity_id": "f120_reactor", "role": "product"}], "sources": [{"source_id": "puurunen2014", "page": 339}]}, {"id": "lohja_el_sold_to_planar", "event_type": "company_sold", "label": "Lohja's EL business sold to Planar Inc.", "description": "In 1990, Lohja's EL business was sold to its American competitor, Planar Inc. Following Sharp in Japan and Planar in the US, Lohja became the third EL manufacturer in the world; Planar International became a subsidiary of the US Planar, and ALE production was concentrated in the Olarinluoma plant.", "date": {"display": "1990", "precision": "year", "sort_start": "1990-01-01", "sort_end": "1990-12-31"}, "participants": [{"entity_id": "lohja_oy", "role": "seller"}, {"entity_id": "planar", "role": "buyer"}], "sources": [{"source_id": "puurunen2014", "page": 338}]}, {"id": "cdte_cell_14pct", "event_type": "other", "label": "Microchemistry CdTe test cell reaches 14% conversion efficiency", "description": "The top achievement in the ALE-CdTe cell development in Microchemistry was a test cell with 14% conversion efficiency, which in the early 1990s was among the highest efficiencies reported for thin film cells; the advantage of ALE was marginal, however, over less expensive technologies, and a decision was made not to enter production scale with ALE-CdTe cells.", "date": {"display": "early 1990s", "precision": "decade", "sort_start": "1990-01-01", "sort_end": "1992-12-31"}, "participants": [{"entity_id": "microchemistry", "role": "organization"}], "sources": [{"source_id": "puurunen2014", "page": 339}]}, {"id": "ale1_symposium_1990", "event_type": "conference", "label": "First International Symposium on Atomic Layer Epitaxy (ALE-1)", "description": "The first International Symposium on Atomic Layer Epitaxy was held in Espoo, June 11-13, 1990; the conference chair was Professor Lauri Niinistö.", "date": {"display": "June 11-13, 1990", "precision": "range", "sort_start": "1990-06-11", "sort_end": "1990-06-13"}, "location": "espoo", "participants": [{"entity_id": "lauri_niinisto", "role": "organizer"}], "sources": [{"source_id": "puurunen2014", "page": 342}]}, {"id": "suntola_visits_leningrad", "event_type": "visit", "label": "Suntola visits Leningrad to meet Prof. Aleskovskii", "description": "At the 1990 ALE-1 conference, Dr. Victor Drozd invited Suntola to visit the University of Leningrad (present St. Petersburg) to meet Prof. Aleskovskii. Suntola travelled to Leningrad in August 1990, where Aleskovskii presented his works on oxide layer build-up based on saturated surface reactions, just as in the ALE process; the discussion confirmed that the essence of ALE had been independently discovered by the Aleskovskii group.", "date": {"display": "August 1990", "precision": "month", "sort_start": "1990-08-01", "sort_end": "1990-08-31"}, "location": "leningrad", "participants": [{"entity_id": "tuomo_suntola", "role": "visitor"}, {"entity_id": "v_b_aleskovskii", "role": "host"}, {"entity_id": "victor_drozd", "role": "inviter"}], "sources": [{"source_id": "puurunen2014", "page": 342}]}, {"id": "mrs_boston_1994", "event_type": "conference", "label": "Suntola gives ALE semiconductor talk at MRS Boston; Microchemistry exhibits", "description": "Since the 1980 SID conference, Suntola had contacts with key people in the display and semiconductor fields. Microchemistry was offered the possibility of a visible introduction of ALE at the MRS 1994 Annual Meeting in Boston; the talk 'ALE for Semiconductor Applications' was complemented by Microchemistry's exhibition booth.", "date": {"display": "1994", "precision": "year", "sort_start": "1994-01-01", "sort_end": "1994-12-31"}, "location": "boston", "participants": [{"entity_id": "tuomo_suntola", "role": "presenter"}, {"entity_id": "microchemistry", "role": "exhibitor"}], "sources": [{"source_id": "puurunen2014", "page": 340}]}, {"id": "microchemistry_refocuses_1997", "event_type": "role_change", "label": "Microchemistry refocused on ALE; Suntola offered Research Fellow position", "description": "In 1997, as part of a larger rearrangement in Neste Oy, Microchemistry was devoted to ALE technology and the reactor business only, and the PV and catalyst research activities were taken under Neste's Central Research. Suntola was offered a Research Fellow's position in Neste, and a business-oriented managing director, Matti Ervasti, was invited to take care of Microchemistry and further ALE business development.", "date": {"display": "1997", "precision": "year", "sort_start": "1997-01-01", "sort_end": "1997-12-31"}, "participants": [{"entity_id": "tuomo_suntola", "role": "subject"}, {"entity_id": "neste", "role": "employer"}, {"entity_id": "matti_ervasti", "role": "new_managing_director"}, {"entity_id": "microchemistry", "role": "organization"}], "sources": [{"source_id": "puurunen2014", "page": 340}]}, {"id": "suntola_hands_over_microchemistry", "event_type": "retirement", "label": "Suntola hands Microchemistry over to Matti Ervasti", "description": "When handing Microchemistry Ltd. over to his successor, Matti Ervasti, in the beginning of 1998, Suntola left behind his active role in ALE, now renamed ALD. As a research fellow in Fortum Oyj (after the fusion of Neste and IVO), Suntola worked for long-term research and global energy issues.", "date": {"display": "early 1998", "precision": "circa", "sort_start": "1998-01-01", "sort_end": "1998-03-31"}, "participants": [{"entity_id": "tuomo_suntola", "role": "subject"}, {"entity_id": "matti_ervasti", "role": "successor"}, {"entity_id": "microchemistry", "role": "organization"}], "sources": [{"source_id": "puurunen2014", "page": 343}]}, {"id": "microchemistry_sold_to_asm", "event_type": "company_sold", "label": "Microchemistry sold to ASM", "description": "In 1999, Microchemistry with all its personnel, ALE expertise, and the patent portfolio was sold to the Dutch company ASM. The ALE activity continued as ASM Microchemistry in Finland.", "date": {"display": "1999", "precision": "year", "sort_start": "1999-01-01", "sort_end": "1999-12-31"}, "participants": [{"entity_id": "neste", "role": "seller"}, {"entity_id": "asm_microchemistry", "role": "buyer_entity"}], "sources": [{"source_id": "puurunen2014", "page": 341}]}, {"id": "picosun_founded", "event_type": "company_founded", "label": "Picosun Oy founded", "description": "Sven Lindfors, Suntola's closest co-worker in ALE reactor design since 1975, set up Picosun Oy with Kustaa Poutiainen in 2004.", "date": {"display": "2004", "precision": "year", "sort_start": "2004-01-01", "sort_end": "2004-12-31"}, "participants": [{"entity_id": "sven_lindfors", "role": "founder"}, {"entity_id": "kustaa_poutiainen", "role": "founder"}, {"entity_id": "picosun", "role": "organization_founded"}], "sources": [{"source_id": "puurunen2014", "page": 341}]}, {"id": "suntola_semi_award", "event_type": "award", "label": "Suntola receives European SEMI Award 2004", "description": "Suntola received the delightful surprise of the European SEMI Award 2004, 'Honoring the Pioneer in Atomic Layer Deposition Techniques ... that paved the way for the development of nanoscale semiconductor devices.' The award was handed to Suntola at the Munich Electronics Show 2004 by Stanley Myers, President and CEO of SEMI (USA); Sven Lindfors and Kustaa Poutiainen of Picosun accompanied him.", "date": {"display": "2004", "precision": "year", "sort_start": "2004-01-01", "sort_end": "2004-12-31"}, "location": "munich", "participants": [{"entity_id": "tuomo_suntola", "role": "recipient"}, {"entity_id": "stanley_myers", "role": "presenter"}, {"entity_id": "semi_award_2004", "role": "award"}, {"entity_id": "semi", "role": "awarding_body"}], "sources": [{"source_id": "puurunen2014", "page": 343}]}, {"id": "beneq_founded", "event_type": "company_founded", "label": "Beneq Oy founded", "description": "In 2005, Beneq Oy was founded, and Pekka Soininen started the ALE reactor activity in the company.", "date": {"display": "2005", "precision": "year", "sort_start": "2005-01-01", "sort_end": "2005-12-31"}, "participants": [{"entity_id": "pekka_soininen", "role": "founder"}, {"entity_id": "beneq", "role": "organization_founded"}], "sources": [{"source_id": "puurunen2014", "page": 341}]}, {"id": "dynamic_universe_published", "event_type": "publication", "label": "Suntola publishes 'The Dynamic Universe' (3rd ed.)", "description": "Since the mid-1990s, with early roots extending to the late 1960s, Suntola worked on a holistic picture of reality, published in the book 'The Dynamic Universe - toward a unified picture of physical reality.'", "date": {"display": "April 2011", "precision": "month", "sort_start": "2011-04-01", "sort_end": "2011-04-30"}, "participants": [{"entity_id": "tuomo_suntola", "role": "author"}, {"entity_id": "dynamic_universe_book", "role": "publication"}], "sources": [{"source_id": "puurunen2014", "page": 343}]}, {"id": "short_history_science_published", "event_type": "publication", "label": "Suntola publishes 'The Short History of Science'", "description": "Linking his philosophical and theoretical considerations to the historical development, Suntola worked on the book 'The Short History of Science - or the long path to the union of metaphysics and empiricism', published in September 2012.", "date": {"display": "September 2012", "precision": "month", "sort_start": "2012-09-01", "sort_end": "2012-09-30"}, "participants": [{"entity_id": "tuomo_suntola", "role": "author"}, {"entity_id": "short_history_science_book", "role": "publication"}], "sources": [{"source_id": "puurunen2014", "page": 343}]}], "relations": [{"id": "tuomo_suntola__born_in__tampere", "source": "tuomo_suntola", "type": "born_in", "target": "tampere", "sources": [{"source_id": "puurunen2014", "page": 333}], "event_id": "suntola_born"}, {"id": "tuomo_suntola__studied_at__hut", "source": "tuomo_suntola", "type": "studied_at", "target": "hut", "sources": [{"source_id": "puurunen2014", "page": 333}], "event_id": "suntola_starts_ee_studies"}, {"id": "tuomo_suntola__educated_by__thor_stubb", "source": "tuomo_suntola", "type": "educated_by", "target": "thor_stubb", "sources": [{"source_id": "puurunen2014", "page": 333, "quote": "Prof. Stubb gave him the green light for the study."}], "event_id": "suntola_picosecond_switches"}, {"id": "tuomo_suntola__employed_by__vtt_semiconductor_lab", "source": "tuomo_suntola", "type": "employed_by", "target": "vtt_semiconductor_lab", "sources": [{"source_id": "puurunen2014", "page": 333}], "event_id": "vtt_first_industrial_order"}, {"id": "tuomo_suntola__invented__humicap_sensor", "source": "tuomo_suntola", "type": "invented", "target": "humicap_sensor", "sources": [{"source_id": "puurunen2014", "page": 333}], "event_id": "humicap_developed"}, {"id": "jorma_antson__invented__humicap_sensor", "source": "jorma_antson", "type": "invented", "target": "humicap_sensor", "sources": [{"source_id": "puurunen2014", "page": 333}], "event_id": "humicap_developed"}, {"id": "tuomo_suntola__employed_by__instrumentarium", "source": "tuomo_suntola", "type": "employed_by", "target": "instrumentarium", "sources": [{"source_id": "puurunen2014", "page": 333}], "event_id": "suntola_joins_instrumentarium"}, {"id": "tuomo_suntola__lived_in__espoo", "source": "tuomo_suntola", "type": "lived_in", "target": "espoo", "sources": [{"source_id": "puurunen2014", "page": 334}], "event_id": "team_moves_to_instrumentarium", "note": "Instrumentarium's Ahertajantie 3, Tapiola, Espoo, where ALE was invented."}, {"id": "tuomo_suntola__invented__ale_invention", "source": "tuomo_suntola", "type": "invented", "target": "ale_invention", "sources": [{"source_id": "puurunen2014", "page": 334, "quote": "The actual invention of ALE matured in early June 1974."}], "event_id": "ale_invented"}, {"id": "tuomo_suntola__patented__ale_patent_1974", "source": "tuomo_suntola", "type": "patented", "target": "ale_patent_1974", "sources": [{"source_id": "puurunen2014", "page": 335}], "event_id": "ale_patent_1974_filed"}, {"id": "tuomo_suntola__patented__ale_patent_1979", "source": "tuomo_suntola", "type": "patented", "target": "ale_patent_1979", "sources": [{"source_id": "puurunen2014", "page": 335}], "event_id": "ale_patent_1979_filed"}, {"id": "tuomo_suntola__patented__lcd_patent", "source": "tuomo_suntola", "type": "patented", "target": "lcd_patent", "sources": [{"source_id": "puurunen2014", "page": 343}], "event_id": "lcd_patent_filed"}, {"id": "instrumentarium__sold_to__lohja_oy", "source": "instrumentarium", "type": "sold_to", "target": "lohja_oy", "sources": [{"source_id": "puurunen2014", "page": 335}], "event_id": "ale_el_sold_to_lohja", "note": "Sold the ALE-EL project, personnel and facility."}, {"id": "sven_lindfors__employed_by__lohja_oy", "source": "sven_lindfors", "type": "employed_by", "target": "lohja_oy", "sources": [{"source_id": "puurunen2014", "page": 336}], "event_id": "zncl2_h2s_process_demonstrated"}, {"id": "arto_pakkala__employed_by__lohja_oy", "source": "arto_pakkala", "type": "employed_by", "target": "lohja_oy", "sources": [{"source_id": "puurunen2014", "page": 336}], "event_id": "zncl2_h2s_process_demonstrated"}, {"id": "sven_lindfors__collaborated_with__tuomo_suntola", "source": "sven_lindfors", "type": "collaborated_with", "target": "tuomo_suntola", "sources": [{"source_id": "puurunen2014", "page": 341, "quote": "Sven Lindfors, the closest co-worker to Suntola in ALE reactor design since 1975."}]}, {"id": "lohja_oy__developed__ale_el_display", "source": "lohja_oy", "type": "developed", "target": "ale_el_display", "sources": [{"source_id": "puurunen2014", "page": 337}], "event_id": "lohja_tfel_pilot_production"}, {"id": "lohja_oy__licensed_to__cge", "source": "lohja_oy", "type": "licensed_to", "target": "cge", "sources": [{"source_id": "puurunen2014", "page": 343}], "event_id": "cge_license_1983"}, {"id": "lauri_niinisto__collaborated_with__tuomo_suntola", "source": "lauri_niinisto", "type": "collaborated_with", "target": "tuomo_suntola", "sources": [{"source_id": "puurunen2014", "page": 342, "quote": "Suntola had contacted Lauri Niinistö ... asking for scientific consultation on ALE chemistry and luminescent materials."}]}, {"id": "jun_ichi_nishizawa__collaborated_with__tuomo_suntola", "source": "jun_ichi_nishizawa", "type": "collaborated_with", "target": "tuomo_suntola", "sources": [{"source_id": "puurunen2014", "page": 341}], "event_id": "nishizawa_kobe_1984", "note": "Nishizawa initially renamed ALE 'Molecular Layer Epitaxy' before recognizing it as the same technique."}, {"id": "lohja_oy__sold_to__planar", "source": "lohja_oy", "type": "sold_to", "target": "planar", "sources": [{"source_id": "puurunen2014", "page": 338}], "event_id": "lohja_el_sold_to_planar"}, {"id": "planar__acquired_by__beneq", "source": "planar", "type": "acquired_by", "target": "beneq", "sources": [{"source_id": "puurunen2014", "page": 338}], "note": "Planar's Olarinluoma EL plant was acquired by Beneq Oy in 2012."}, {"id": "tapio_alvesalo__collaborated_with__tuomo_suntola", "source": "tapio_alvesalo", "type": "collaborated_with", "target": "tuomo_suntola", "sources": [{"source_id": "puurunen2014", "page": 338}], "event_id": "microchemistry_founded"}, {"id": "tuomo_suntola__founded__microchemistry", "source": "tuomo_suntola", "type": "founded", "target": "microchemistry", "sources": [{"source_id": "puurunen2014", "page": 338}], "event_id": "microchemistry_founded"}, {"id": "microchemistry__member_of__neste", "source": "microchemistry", "type": "member_of", "target": "neste", "sources": [{"source_id": "puurunen2014", "page": 338}], "note": "Microchemistry Ltd. was a subsidiary of Neste."}, {"id": "naps__member_of__neste", "source": "naps", "type": "member_of", "target": "neste", "sources": [{"source_id": "puurunen2014", "page": 339}], "note": "NAPS was Neste's corporate venture unit."}, {"id": "tuomo_suntola__developed__f120_reactor", "source": "tuomo_suntola", "type": "developed", "target": "f120_reactor", "sources": [{"source_id": "puurunen2014", "page": 339}], "event_id": "f120_reactor_built"}, {"id": "sven_lindfors__developed__f120_reactor", "source": "sven_lindfors", "type": "developed", "target": "f120_reactor", "sources": [{"source_id": "puurunen2014", "page": 339}], "event_id": "f120_reactor_built"}, {"id": "tuomo_suntola__visited__leningrad", "source": "tuomo_suntola", "type": "visited", "target": "leningrad", "sources": [{"source_id": "puurunen2014", "page": 342}], "event_id": "suntola_visits_leningrad"}, {"id": "tuomo_suntola__met__v_b_aleskovskii", "source": "tuomo_suntola", "type": "met", "target": "v_b_aleskovskii", "sources": [{"source_id": "puurunen2014", "page": 342}], "event_id": "suntola_visits_leningrad"}, {"id": "victor_drozd__collaborated_with__tuomo_suntola", "source": "victor_drozd", "type": "collaborated_with", "target": "tuomo_suntola", "sources": [{"source_id": "puurunen2014", "page": 342}], "event_id": "suntola_visits_leningrad"}, {"id": "v_b_aleskovskii__invented__ale_invention", "source": "v_b_aleskovskii", "type": "invented", "target": "ale_invention", "sources": [{"source_id": "puurunen2014", "page": 342, "quote": "The discussion confirmed that the essence of ALE had been independently discovered by the Aleskovskii group."}], "note": "Independently discovered the essence of ALE in the 1960s in the USSR, under the name 'molecular layering'."}, {"id": "tuomo_suntola__employed_by__neste", "source": "tuomo_suntola", "type": "employed_by", "target": "neste", "sources": [{"source_id": "puurunen2014", "page": 340}], "event_id": "microchemistry_refocuses_1997"}, {"id": "matti_ervasti__employed_by__microchemistry", "source": "matti_ervasti", "type": "employed_by", "target": "microchemistry", "sources": [{"source_id": "puurunen2014", "page": 340}], "event_id": "microchemistry_refocuses_1997"}, {"id": "neste__sold_to__asm_microchemistry", "source": "neste", "type": "sold_to", "target": "asm_microchemistry", "sources": [{"source_id": "puurunen2014", "page": 341}], "event_id": "microchemistry_sold_to_asm"}, {"id": "sven_lindfors__founded__picosun", "source": "sven_lindfors", "type": "founded", "target": "picosun", "sources": [{"source_id": "puurunen2014", "page": 341}], "event_id": "picosun_founded"}, {"id": "kustaa_poutiainen__founded__picosun", "source": "kustaa_poutiainen", "type": "founded", "target": "picosun", "sources": [{"source_id": "puurunen2014", "page": 341}], "event_id": "picosun_founded"}, {"id": "tuomo_suntola__employed_by__picosun", "source": "tuomo_suntola", "type": "employed_by", "target": "picosun", "sources": [{"source_id": "puurunen2014", "page": 341, "quote": "In 2004, Suntola joined Picosun Oy, first as the scientific adviser and, since 2007, as a board member."}]}, {"id": "tuomo_suntola__awarded__semi_award_2004", "source": "tuomo_suntola", "type": "awarded", "target": "semi_award_2004", "sources": [{"source_id": "puurunen2014", "page": 343}], "event_id": "suntola_semi_award"}, {"id": "stanley_myers__collaborated_with__tuomo_suntola", "source": "stanley_myers", "type": "collaborated_with", "target": "tuomo_suntola", "sources": [{"source_id": "puurunen2014", "page": 343}], "event_id": "suntola_semi_award"}, {"id": "pekka_soininen__founded__beneq", "source": "pekka_soininen", "type": "founded", "target": "beneq", "sources": [{"source_id": "puurunen2014", "page": 341}], "event_id": "beneq_founded"}, {"id": "tuomo_suntola__published__dynamic_universe_book", "source": "tuomo_suntola", "type": "published", "target": "dynamic_universe_book", "sources": [{"source_id": "puurunen2014", "page": 343}], "event_id": "dynamic_universe_published"}, {"id": "tuomo_suntola__published__short_history_science_book", "source": "tuomo_suntola", "type": "published", "target": "short_history_science_book", "sources": [{"source_id": "puurunen2014", "page": 343}], "event_id": "short_history_science_published"}, {"id": "salah_bedair__collaborated_with__ncsu", "source": "salah_bedair", "type": "collaborated_with", "target": "ncsu", "sources": [{"source_id": "puurunen2014", "page": 341}], "note": "Bedair's group demonstrated ALE of GaAs in a CVD system at NCSU."}, {"id": "markku_leskela__collaborated_with__mikko_ritala", "source": "markku_leskela", "type": "collaborated_with", "target": "mikko_ritala", "sources": [{"source_id": "puurunen2014", "page": 341}], "note": "Co-head the Finnish Centre of Excellence in Atomic Layer Deposition."}, {"id": "tuomo_suntola__member_of__tut", "source": "tuomo_suntola", "type": "member_of", "target": "tut", "sources": [{"source_id": "puurunen2014", "page": 342, "quote": "Suntola was nominated as a docent in TUT, and he continued to give the lectures every second Friday for a couple of years."}], "note": "Docent at Tampere University of Technology from 1975."}, {"id": "antti_piippo__founded__elcoteq", "source": "antti_piippo", "type": "founded", "target": "elcoteq", "sources": [{"source_id": "puurunen2014", "page": 338}], "note": "Bought Elcoteq Oy with close colleagues in 1991."}, {"id": "ahti_aintila__employed_by__lohja_oy", "source": "ahti_aintila", "type": "employed_by", "target": "lohja_oy", "sources": [{"source_id": "puurunen2014", "page": 338}], "note": "Led major EL panel driving-circuitry developments; left the microelectronics division in late 1984."}, {"id": "ulf_strom__employed_by__finlux", "source": "ulf_strom", "type": "employed_by", "target": "finlux", "sources": [{"source_id": "puurunen2014", "page": 338}], "note": "Managing director of Finlux Inc., which marketed ALE-EL panels in the USA (photo caption)."}, {"id": "ulf_strom__collaborated_with__tuomo_suntola", "source": "ulf_strom", "type": "collaborated_with", "target": "tuomo_suntola", "sources": [{"source_id": "puurunen2014", "page": 338}]}], "sources": [{"id": "puurunen2014", "title": "A Short History of Atomic Layer Deposition: Tuomo Suntola's Atomic Layer Epitaxy", "authors": ["Riikka L. Puurunen"], "year": 2014, "publication": "Chemical Vapor Deposition, 20, 332-344", "file": "data/CVD 2014 - Puurunen - A Short History of Atomic Layer Deposition Tuomo Suntola s Atomic Layer.pdf", "doi": "10.1002/cvde.201402012"}]}</script>
<script>
(function(){
  "use strict";
  const DATA = JSON.parse(document.getElementById("graph-data").textContent);
  const entities = DATA.entities, events = DATA.events, relations = DATA.relations, sources = DATA.sources;

  const entById = new Map(entities.map(e => [e.id, e]));
  const srcById = new Map(sources.map(s => [s.id, s]));
  const eventsById = new Map(events.map(e => [e.id, e]));

  const TYPE_COLOR = {person:"var(--c-person)", place:"var(--c-place)", organization:"var(--c-organization)", artifact:"var(--c-artifact)"};
  const TYPE_COLOR_HEX = {person:"#2a78d6", place:"#1baf7a", organization:"#eb6834", artifact:"#4a3aa7"};

  // ---- build graph edges: dedupe parallel relation edges into one visual link per (source,target) unordered pair, keep list of relations
  const pairKey = (a,b) => a < b ? a+"|"+b : b+"|"+a;
  const linkMap = new Map();
  relations.forEach(r => {
    if(!entById.has(r.source) || !entById.has(r.target)) return;
    const k = pairKey(r.source, r.target);
    if(!linkMap.has(k)) linkMap.set(k, {source:r.source, target:r.target, rels:[]});
    linkMap.get(k).rels.push(r);
  });
  const links = Array.from(linkMap.values());

  // degree for node sizing
  const degree = new Map(entities.map(e => [e.id, 0]));
  links.forEach(l => { degree.set(l.source, (degree.get(l.source)||0)+1); degree.set(l.target, (degree.get(l.target)||0)+1); });

  // entity -> event ids it participates in
  const entEvents = new Map(entities.map(e => [e.id, []]));
  events.forEach(ev => ev.participants.forEach(p => { if(entEvents.has(p.entity_id)) entEvents.get(p.entity_id).push(ev.id); }));

  // ================= GRAPH =================
  const graphSvg = d3.select("#graph");
  const defs = graphSvg.append("defs");
  const graphG = graphSvg.append("g");
  const linkLayer = graphG.append("g").attr("class","links");
  const nodeLayer = graphG.append("g").attr("class","nodes");

  let width = 0, height = 0;
  function measure(){
    const r = document.getElementById("graph-wrap").getBoundingClientRect();
    width = r.width; height = r.height;
  }
  measure();

  const nodes = entities.map(e => {
    const deg = degree.get(e.id) || 0;
    const hasPortrait = !!e.portrait;
    const r = hasPortrait ? 19 : 7 + Math.min(14, deg*1.6);
    return Object.assign({}, e, {r, deg, hasPortrait, hub: deg >= 2 || hasPortrait});
  });
  const nodeById = new Map(nodes.map(n => [n.id, n]));

  const sim = d3.forceSimulation(nodes)
    .force("charge", d3.forceManyBody().strength(-340))
    .force("link", d3.forceLink(links).id(d=>d.id).distance(92).strength(0.5))
    .force("center", d3.forceCenter(width/2, height/2))
    .force("collide", d3.forceCollide().radius(d=>d.r + (d.hub? 34 : 14)))
    .force("x", d3.forceX(width/2).strength(0.03))
    .force("y", d3.forceY(height/2).strength(0.03));

  const linkSel = linkLayer.selectAll("line.link")
    .data(links).join("line")
    .attr("class","link")
    .on("mouseover", (event,d) => {
      const types = [...new Set(d.rels.map(r=>r.type))].join(", ");
      showTooltip(event, `<b>${entById.get(d.source.id||d.source).name}</b> → <b>${entById.get(d.target.id||d.target).name}</b><br><span>${types}</span>`);
    })
    .on("mousemove", moveTooltip)
    .on("mouseout", hideTooltip);

  const nodeSel = nodeLayer.selectAll("g.node")
    .data(nodes).join("g")
    .attr("class", d => "node" + (d.hub ? " hub" : ""))
    .call(d3.drag()
      .on("start", (event,d)=>{ if(!event.active) sim.alphaTarget(0.25).restart(); d.fx=d.x; d.fy=d.y; })
      .on("drag", (event,d)=>{ d.fx=event.x; d.fy=event.y; })
      .on("end", (event,d)=>{ if(!event.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }));

  // fallback colored circle (always present, hidden if a portrait loads)
  nodeSel.append("circle")
    .attr("class","fill")
    .attr("r", d=>d.r)
    .attr("fill", d=>TYPE_COLOR[d.entity_type]);

  // portrait image + colored ring, for verified photos only
  nodeSel.filter(d=>d.hasPortrait).each(function(d){
    const g = d3.select(this);
    const clipId = "clip-"+d.id;
    defs.append("clipPath").attr("id", clipId).append("circle").attr("r", d.r-2);
    const img = g.append("image")
      .attr("x", -(d.r-2)).attr("y", -(d.r-2))
      .attr("width", (d.r-2)*2).attr("height", (d.r-2)*2)
      .attr("preserveAspectRatio","xMidYMid slice")
      .attr("clip-path", `url(#${clipId})`)
      .attr("href", d.portrait.image_url)
      .style("opacity", 0);
    img.on("load", function(){ d3.select(this).style("opacity", 1); g.select("circle.fill").style("opacity", 0); });
    img.on("error", function(){ d3.select(this).remove(); }); // fallback circle stays visible
    g.append("circle").attr("class","ring").attr("r", d.r-1.25).attr("stroke", TYPE_COLOR[d.entity_type]);
  });

  nodeSel.append("text")
    .attr("class","label")
    .attr("x", d=>d.r+5).attr("y", 3)
    .text(d=>d.name);

  nodeSel.on("click", (event,d) => { event.stopPropagation(); selectEntity(d.id); })
    .on("mouseover", (event,d) => showTooltip(event, `<b>${d.name}</b><br><span>${d.entity_type}${d.subtype? " · "+d.subtype:""}</span>`))
    .on("mousemove", moveTooltip)
    .on("mouseout", hideTooltip);

  sim.on("tick", () => {
    linkSel.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
    nodeSel.attr("transform", d=>`translate(${d.x},${d.y})`);
  });

  const zoom = d3.zoom().scaleExtent([0.25, 4]).on("zoom", (event) => graphG.attr("transform", event.transform));
  graphSvg.call(zoom);
  graphSvg.on("click", () => { selectNone(); });

  window.addEventListener("resize", () => {
    measure();
    sim.force("center", d3.forceCenter(width/2, height/2));
    sim.force("x", d3.forceX(width/2).strength(0.03));
    sim.force("y", d3.forceY(height/2).strength(0.03));
    sim.alpha(0.3).restart();
    drawTimeline();
  });

  // ================= TOOLTIP =================
  const tip = document.getElementById("tooltip");
  function showTooltip(event, html){ tip.innerHTML = html; tip.style.opacity = 1; moveTooltip(event); }
  function moveTooltip(event){ tip.style.left=(event.clientX+14)+"px"; tip.style.top=(event.clientY+10)+"px"; }
  function hideTooltip(){ tip.style.opacity = 0; }

  // ================= LEGEND =================
  const legend = d3.select("#legend");
  const typeVisible = {person:true, place:true, organization:true, artifact:true};
  const legendItems = legend.selectAll(".item")
    .data(["person","place","organization","artifact"]).join("div")
    .attr("class","item")
    .on("click", function(event,t){
      typeVisible[t] = !typeVisible[t];
      d3.select(this).classed("off", !typeVisible[t]);
      applyTypeFilter();
    });
  legendItems.append("span").attr("class","dot").style("background", d=>TYPE_COLOR[d]);
  legendItems.append("span").text(d=>d[0].toUpperCase()+d.slice(1)+"s");

  function applyTypeFilter(){
    nodeSel.style("display", d => typeVisible[d.entity_type] ? null : "none");
    linkSel.style("display", d => {
      const s = entById.get(d.source.id||d.source), t = entById.get(d.target.id||d.target);
      return (typeVisible[s.entity_type] && typeVisible[t.entity_type]) ? null : "none";
    });
  }

  // ================= SELECTION / SIDE PANEL =================
  let selected = null; // {kind:'entity'|'event', id}

  function selectNone(){
    selected = null;
    nodeSel.classed("dim", false).classed("show-label", false);
    linkSel.classed("dim", false).classed("active", false);
    d3.selectAll(".ev-mark").classed("dim", false).classed("selected", false);
    document.getElementById("side-content").innerHTML = '<div class="empty">Click a person, place, organization, invention — or an event on the timeline below — to explore.</div>';
  }

  function selectEntity(id){
    selected = {kind:"entity", id};
    const connected = new Set([id]);
    links.forEach(l => {
      const sId = l.source.id||l.source, tId = l.target.id||l.target;
      if(sId===id) connected.add(tId);
      if(tId===id) connected.add(sId);
    });
    nodeSel.classed("dim", d => !connected.has(d.id))
           .classed("show-label", d => connected.has(d.id));
    linkSel.classed("dim", d => !(((d.source.id||d.source)===id) || ((d.target.id||d.target)===id)))
           .classed("active", d => ((d.source.id||d.source)===id) || ((d.target.id||d.target)===id));

    const relatedEventIds = new Set(entEvents.get(id)||[]);
    d3.selectAll(".ev-mark")
      .classed("dim", d => !relatedEventIds.has(d.id))
      .classed("selected", false);

    renderEntityPanel(entById.get(id), links.filter(l => (l.source.id||l.source)===id || (l.target.id||l.target)===id));
  }

  function selectEvent(id){
    selected = {kind:"event", id};
    const ev = eventsById.get(id);
    const partIds = new Set(ev.participants.map(p=>p.entity_id).concat(ev.location?[ev.location]:[]));
    nodeSel.classed("dim", d => !partIds.has(d.id)).classed("show-label", d => partIds.has(d.id));
    linkSel.classed("dim", true).classed("active", false);
    d3.selectAll(".ev-mark").classed("selected", d => d.id===id).classed("dim", d => d.id!==id);
    renderEventPanel(ev);
  }

  function renderEntityPanel(e, connLinks){
    const rows = connLinks.map(l => {
      const otherId = (l.source.id||l.source)===e.id ? (l.target.id||l.target) : (l.source.id||l.source);
      const other = entById.get(otherId);
      const types = l.rels.map(r => {
        const dirTxt = (r.source===e.id) ? `${r.type} →` : `← ${r.type}`;
        return dirTxt;
      }).join(", ");
      const cites = l.rels.flatMap(r=>r.sources).map(s => citeText(s)).join("; ");
      return `<div class="rel-row" data-goto="${other.id}"><div>${other.name}</div><div class="t">${types}</div>${cites?`<div class="cite">${cites}</div>`:""}</div>`;
    }).join("");
    const evIds = entEvents.get(e.id)||[];
    const evRows = evIds.map(id=>eventsById.get(id)).sort((a,b)=>a.date.sort_start.localeCompare(b.date.sort_start))
      .map(ev => `<div class="rel-row" data-goto-event="${ev.id}"><div>${ev.label}</div><div class="t">${ev.date.display}</div></div>`).join("");

    const portrait = e.portrait ? `
      <div class="portrait-block">
        <div class="portrait-wrap"><img src="${e.portrait.image_url}" alt="${e.name}" onerror="this.closest('.portrait-block').style.display='none'"></div>
        <div class="portrait-credit">Photo: <a href="${e.portrait.source_url}" target="_blank" rel="noopener">Wikimedia Commons</a>${e.portrait.artist? ", "+e.portrait.artist:""} · ${e.portrait.license}</div>
      </div>
    ` : "";

    document.getElementById("side-content").innerHTML = `
      ${portrait}
      <h2>${e.name}</h2>
      <div class="kind" style="color:${TYPE_COLOR_HEX[e.entity_type]}">${e.entity_type}${e.subtype? " · "+e.subtype:""}</div>
      ${e.summary?`<p class="summary">${e.summary}</p>`:""}
      ${evRows?`<div class="section-title">Timeline (${evIds.length})</div>${evRows}`:""}
      ${rows?`<div class="section-title">Connections (${connLinks.length})</div>${rows}`:""}
    `;
    bindPanelClicks();
  }

  function citeText(s){
    const src = srcById.get(s.source_id);
    const title = src ? src.title : s.source_id;
    return `${title}${s.page?", p. "+s.page:""}${s.quote? " — “"+s.quote+"”":""}`;
  }

  function renderEventPanel(ev){
    const parts = ev.participants.map(p => {
      const e = entById.get(p.entity_id);
      return `<div class="rel-row" data-goto="${e.id}"><div>${e.name}</div><div class="t">${p.role}</div></div>`;
    }).join("");
    const loc = ev.location ? entById.get(ev.location) : null;
    const cites = ev.sources.map(citeText).join("<br>");
    document.getElementById("side-content").innerHTML = `
      <h2>${ev.label}</h2>
      <div class="date-badge">${ev.date.display}</div>
      <div class="kind">${ev.event_type.replace(/_/g," ")}${loc? " · "+loc.name:""}</div>
      ${ev.description?`<p class="summary">${ev.description}</p>`:""}
      <div class="section-title">Participants (${ev.participants.length})</div>
      ${parts}
      <div class="section-title">Source${ev.sources.length>1?"s":""}</div>
      <div class="cite">${cites}</div>
    `;
    bindPanelClicks();
  }

  function bindPanelClicks(){
    document.querySelectorAll("[data-goto]").forEach(el => el.addEventListener("click", () => {
      selectEntity(el.getAttribute("data-goto"));
      centerOn(el.getAttribute("data-goto"));
    }));
    document.querySelectorAll("[data-goto-event]").forEach(el => el.addEventListener("click", () => {
      const id = el.getAttribute("data-goto-event");
      selectEvent(id);
      flashTimelineEvent(id);
    }));
  }

  function centerOn(id){
    const n = nodeById.get(id);
    if(!n) return;
    const t = d3.zoomTransform(graphSvg.node());
    const target = d3.zoomIdentity.translate(width/2 - n.x*t.k, height/2 - n.y*t.k).scale(t.k);
    graphSvg.transition().duration(500).call(zoom.transform, target);
  }

  // ================= SEARCH =================
  const searchBox = document.getElementById("search");
  searchBox.addEventListener("input", () => {
    const q = searchBox.value.trim().toLowerCase();
    if(!q){ nodeSel.classed("dim", false).classed("show-label", false); return; }
    nodeSel.classed("dim", d => !d.name.toLowerCase().includes(q))
           .classed("show-label", d => d.name.toLowerCase().includes(q));
  });
  searchBox.addEventListener("keydown", (e) => {
    if(e.key==="Enter"){
      const q = searchBox.value.trim().toLowerCase();
      const hit = nodes.find(n=>n.name.toLowerCase().includes(q));
      if(hit){ selectEntity(hit.id); centerOn(hit.id); }
    }
  });

  document.getElementById("reset-btn").addEventListener("click", () => {
    selectNone();
    searchBox.value = "";
    graphSvg.transition().duration(400).call(zoom.transform, d3.zoomIdentity);
    resetTimelineZoom();
  });

  // ================= TIMELINE =================
  const tlSvg = d3.select("#timeline");
  const tlMargin = {top:14, right:24, bottom:26, left:24};
  let tlWidth=0, tlHeight=0;
  const parsed = events.map(ev => Object.assign({}, ev,
    {_start: new Date(ev.date.sort_start+"T00:00:00"), _end: new Date(ev.date.sort_end+"T00:00:00")}));
  const timeExtent = d3.extent(parsed.flatMap(e=>[e._start,e._end]));
  // pad extent
  const pad = (timeExtent[1]-timeExtent[0])*0.04;
  const fullDomain = [new Date(+timeExtent[0]-pad), new Date(+timeExtent[1]+pad)];
  let xScale = d3.scaleTime().domain(fullDomain);
  let currentTransform = d3.zoomIdentity;

  const tlG = tlSvg.append("g");
  const axisG = tlG.append("g").attr("id","axis");
  const laneG = tlG.append("g");

  const EVENT_TYPES = ["birth","death","education","employment_start","employment_end","role_change",
      "invention","patent_filed","patent_granted","publication","product_launch","public_demonstration",
      "conference","visit","meeting","relocation","award","company_founded","company_sold","company_renamed",
      "retirement","other"];

  const rowFor = d3.scaleOrdinal()
    .domain(EVENT_TYPES)
    .range([0,1,0,1,1,1, 2,2,2,3,3,4, 4,1,1,1, 3,2,2,2, 1,4]);

  // event colors reuse the same validated categorical hues as the graph, grouped by
  // which kind of node the event is really "about" (person/org/artifact/place),
  // plus a dedicated accent for the rare, special "award" case.
  const EV_COLOR = d3.scaleOrdinal()
    .domain(EVENT_TYPES)
    .range(["#2a78d6","#2a78d6","#eb6834","#eb6834","#eb6834","#eb6834",
      "#4a3aa7","#4a3aa7","#4a3aa7","#4a3aa7","#4a3aa7","#4a3aa7",
      "#1baf7a","#1baf7a","#1baf7a","#1baf7a","#eda100","#eb6834","#eb6834","#eb6834",
      "#eb6834","#8b8a83"]);

  function tlMeasure(){
    const r = document.getElementById("timeline-wrap").getBoundingClientRect();
    tlWidth = r.width; tlHeight = r.height;
    xScale.range([tlMargin.left, tlWidth-tlMargin.right]);
  }
  tlMeasure();

  function drawTimeline(){
    tlMeasure();
    const zx = currentTransform.rescaleX(xScale);
    const axis = d3.axisBottom(zx).ticks(Math.max(3, tlWidth/110)).tickSizeOuter(0);
    axisG.attr("transform", `translate(0,${tlHeight-tlMargin.bottom})`).call(axis);
    axisG.select(".domain").remove();

    const rows = 5, rowH = (tlHeight-tlMargin.top-tlMargin.bottom-8)/rows;
    const marks = laneG.selectAll("g.ev-mark").data(parsed, d=>d.id);
    const marksEnter = marks.enter().append("g").attr("class","ev-mark")
      .on("click", (event,d) => { event.stopPropagation(); selectEvent(d.id); })
      .on("mouseover", (event,d) => showTooltip(event, `<b>${d.label}</b><br><span>${d.date.display} · ${d.event_type.replace(/_/g," ")}</span>`))
      .on("mousemove", moveTooltip)
      .on("mouseout", hideTooltip);
    marksEnter.append("rect");

    const merged = marksEnter.merge(marks);
    merged.each(function(d){
      const g = d3.select(this);
      const x1 = zx(d._start), x2 = zx(d._end);
      const y = tlMargin.top + rowFor(d.event_type)*rowH + rowH/2;
      const w = Math.max(9, x2-x1);
      g.select("rect")
        .attr("x", x1 - (w<=9? 4.5 : 0)).attr("y", y-4.5)
        .attr("width", w).attr("height", 9)
        .attr("rx", 4.5)
        .attr("fill", EV_COLOR(d.event_type));
    });
    marks.exit().remove();
  }

  const tlZoom = d3.zoom().scaleExtent([1,60])
    .translateExtent([[tlMargin.left,0],[tlWidth-tlMargin.right,0]])
    .extent([[tlMargin.left,0],[tlWidth-tlMargin.right,0]])
    .on("zoom", (event) => { currentTransform = event.transform; drawTimeline(); });
  tlSvg.call(tlZoom);
  tlSvg.on("click", () => selectNone());

  function resetTimelineZoom(){ tlSvg.transition().duration(400).call(tlZoom.transform, d3.zoomIdentity); }
  function flashTimelineEvent(id){
    const d = parsed.find(e=>e.id===id);
    if(!d) return;
    const zx = currentTransform.rescaleX(xScale);
    const cx = zx(d._start);
    if(cx < tlMargin.left || cx > tlWidth-tlMargin.right){ resetTimelineZoom(); }
  }

  drawTimeline();
  window.addEventListener("resize", drawTimeline);
})();
</script>
</body>
</html>
